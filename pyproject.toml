[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitefrost"
version = "1.0.0"
description = "Python SDK for the KiteFrost API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "kitefrost", "npc", "dialogue", "game-narrative", "ttrpg", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://kitefrost.ai"
Repository = "https://github.com/kitefrost/python-sdk"
Issues = "https://github.com/kitefrost/python-sdk/issues"
Documentation = "https://docs.kitefrost.ai/sdks/python"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kitefrost"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
"src/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# Per-language workspace (Option A, PPI-3): the shared core + every generated
# per-pack package live under packages/. Each is independently buildable +
# publishable to PyPI (kitefrost-core, kitefrost-<pack>); a customer installs
# only their pack's package + the core. Declared as a uv workspace; the whole
# sdk/python/ tree syncs to the public kitefrost/python-sdk repo.
[tool.uv.workspace]
members = ["packages/*"]
